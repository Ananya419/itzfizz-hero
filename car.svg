<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Car body -->
  <path d="M20 55 L30 25 Q35 15 50 15 L140 15 Q155 15 165 25 L180 45 Q185 55 175 55 Z" fill="#fa7328"/>
  <!-- Car roof/windshield -->
  <path d="M55 15 L60 25 L130 25 L140 15 Z" fill="#222" opacity="0.8"/>
  <path d="M130 25 L140 15 L155 15 Q160 15 162 20 L155 25 Z" fill="#444" opacity="0.6"/>
  <!-- Wheels -->
  <ellipse cx="155" cy="55" rx="18" ry="12" fill="#111"/>
  <ellipse cx="45" cy="55" rx="18" ry="12" fill="#111"/>
  <ellipse cx="155" cy="55" rx="8" ry="5" fill="#333"/>
  <ellipse cx="45" cy="55" rx="8" ry="5" fill="#333"/>
  <!-- Headlights -->
  <ellipse cx="180" cy="35" rx="4" ry="7" fill="#fff" filter="url(#glow)"/>
  <ellipse cx="180" cy="50" rx="4" ry="7" fill="#fff" filter="url(#glow)"/>
  <path d="M180 35 L195 30 Q200 35 195 40 Z" fill="rgba(255, 255, 255, 0.4)" filter="url(#glow)"/>
  <path d="M180 50 L195 45 Q200 50 195 55 Z" fill="rgba(255, 255, 255, 0.4)" filter="url(#glow)"/>
  <!-- Tail lights -->
  <ellipse cx="22" cy="35" rx="3" ry="5" fill="#f00" opacity="0.8"/>
  <ellipse cx="22" cy="50" rx="3" ry="5" fill="#f00" opacity="0.8"/>
</svg>
